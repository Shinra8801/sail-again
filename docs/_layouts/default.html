<!DOCTYPE html>
{% comment %}
Original: https://github.com/pages-themes/primer/blob/master/_layouts/default.html
{% endcomment %}
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">

    <title>{{ page.title }} | {{ site.title }}</title>
</head>
<body>
<div class="container-lg px-3 my-5 markdown-body">
    {% if site.title and site.title != page.title %}
    <div class="site-name"><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></div>
    {% endif %}

    {{ content }}

    <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        By <a href="https://x.com/{{ site.twitter_username }}" target="_blank">@{{ site.twitter_username }}</a>
    </div>
</div>

</body>
</html>
